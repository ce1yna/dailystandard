    <link rel="stylesheet" href="custom.css">
  </head>

  <body>

    <header class="siteheader">
      <nav aria-label="Main">
        <ul class="navigation">
          <li><a href="index.html">Home</a></li>
          <li><a href=shop.html>Shop</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contacts</a></li>
        </ul>
      </nav>
    </header>

<main class="py-5">
  <div class="container text-center">
    
    <!-- Header -->
    <div class="mb-5">
      <h1 class="page-title">Contact Us</h1>
      <p>Have a question? We'd love to hear from you.</p>
    </div>

    <!-- Send Us a Message -->
<div class="row justify-content-center mb-4">
  <div class="col-12 d-flex justify-content-center">
    <div id="message-container" class="p-4 p-md-5">
      <h2 class="card-title text-center mb-4">Send Us a Message</h2>
      
      <form class="contact-form mx-auto">
        
        <div class="mb-3 text-start">
          <label for="name" class="form-label d-block mb-1">Name</label>
          <input type="text" class="form-control" id="name" required>
        </div>

        <div class="mb-3 text-start">
          <label for="email" class="form-label d-block mb-1">E-mail</label>
          <input type="email" class="form-control" id="email" required>
        </div>

        <div class="mb-3 text-start">
          <label for="subject" class="form-label d-block mb-1">Subject</label>
          <input type="text" class="form-control" id="subject" required>
        </div>

        <div class="mb-4 text-start">
          <label for="message" class="form-label d-block mb-1">Message</label>
          <textarea class="form-control" id="message" rows="5" required></textarea>
        </div>

        <div class="text-center mt-4">
          <button class="button" type="submit">Send Message</button>
        </div>

      </form>
    </div>
  </div>
</div>

</main>

   <footer class="py-4">
      <div class="container-fluid px-4 d-flex align-items-center gap-4">

  </body>
